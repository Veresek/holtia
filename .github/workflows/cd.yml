name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy (docker compose)
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "DEPLOY_PATH='${{ vars.DEPLOY_PATH }}' bash -s" <<'SSH'
          set -euo pipefail
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 24

          : "${DEPLOY_PATH:=$HOME/holtia}"
          case "$DEPLOY_PATH" in
            ~) DEPLOY_PATH="$HOME" ;;
            ~/*) DEPLOY_PATH="$HOME/${DEPLOY_PATH#~/}" ;;
          esac
          cd "$DEPLOY_PATH"
          git pull origin main

          if [ ! -f .env ]; then
            echo "Missing .env in $(pwd). Copy .env.example and fill production values." >&2
            exit 1
          fi

          mkdir -p backups
          if sudo docker compose -f docker-compose.prod.yml exec -T db pg_isready -U holtia -d holtia >/dev/null 2>&1; then
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            dump="backups/holtia-${stamp}.sql.gz"
            echo "Backing up postgres to ${dump}"
            sudo docker compose -f docker-compose.prod.yml exec -T db pg_dump -U holtia holtia | gzip >"$dump"
            ls -1t backups/holtia-*.sql.gz | tail -n +11 | xargs -r rm -f --
          else
            echo "Postgres is not running yet; skipping backup"
          fi

          sudo docker compose -f docker-compose.prod.yml up -d --build

          cd client
          npm ci
          npm run build
          SSH
