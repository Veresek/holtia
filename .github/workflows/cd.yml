name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy (docker compose)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh -p "$DEPLOY_PORT" \
            -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") bash -s" <<'SSH'
          set -euo pipefail
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            echo "nvm is not installed at $NVM_DIR" >&2
            exit 1
          fi
          set +u
          . "$NVM_DIR/nvm.sh"
          nvm use 24
          set -u

          : "${DEPLOY_PATH:=$HOME/holtia}"
          case "$DEPLOY_PATH" in
            ~) DEPLOY_PATH="$HOME" ;;
            ~/*) DEPLOY_PATH="$HOME/${DEPLOY_PATH#~/}" ;;
          esac
          cd "$DEPLOY_PATH"
          git pull origin main

          if [ ! -f .env ]; then
            echo "Missing .env in $(pwd). Copy .env.example and fill production values." >&2
            exit 1
          fi

          echo "Building SPA into client/dist"
          (
            cd client
            npm ci
            npm run build
            if [ ! -f dist/index.html ]; then
              echo "client/dist/index.html was not produced" >&2
              exit 1
            fi
            ls -l dist/index.html
          )

          mkdir -p backups
          if sudo docker compose -f docker-compose.prod.yml exec -T db pg_isready -U holtia -d holtia >/dev/null 2>&1; then
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            dump="backups/holtia-${stamp}.sql.gz"
            echo "Backing up postgres to ${dump}"
            sudo docker compose -f docker-compose.prod.yml exec -T db pg_dump -U holtia holtia | gzip >"$dump"
            ls -1t backups/holtia-*.sql.gz | tail -n +11 | xargs -r rm -f --
          else
            echo "Postgres is not running yet; skipping backup"
          fi

          sudo docker compose -f docker-compose.prod.yml up -d --build
          SSH
