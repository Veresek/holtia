services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: holtia
      POSTGRES_USER: holtia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holtia -d holtia"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal

  server:
    build:
      context: ./server
    command:
      - sh
      - -c
      - >-
        python scripts/migrate.py &&
        (python scripts/purge_revoked_tokens.py || true) &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8001
        --proxy-headers --forwarded-allow-ips=172.16.0.0/12,10.0.0.0/8,127.0.0.1
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://holtia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/holtia
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      TIMEZONE: ${TIMEZONE:-Europe/Warsaw}
      CLIENT_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    # Lets the API reach a mail server running on the host. SMTP_HOST must
    # still be the mail server's own hostname: STARTTLS verifies its
    # certificate.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8001/api/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
