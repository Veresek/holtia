services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: holtia
      POSTGRES_USER: holtia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holtia -d holtia"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal

  server:
    build:
      context: ./server
    command:
      - sh
      - -c
      - >-
        python scripts/migrate.py &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8001
        --proxy-headers --forwarded-allow-ips=172.16.0.0/12,10.0.0.0/8,127.0.0.1
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://holtia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/holtia
      INSTANCE_CODE: ${INSTANCE_CODE:?Set INSTANCE_CODE}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      TIMEZONE: ${TIMEZONE:-Europe/Warsaw}
      CLIENT_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8001/api/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
