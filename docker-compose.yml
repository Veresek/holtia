services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: trium
      POSTGRES_USER: trium
      POSTGRES_PASSWORD: trium
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trium -d trium"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  server:
    build:
      context: ./server
    command: >
      sh -c "python scripts/migrate.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://trium:trium@db:5432/trium
      INSTANCE_CODE: ${INSTANCE_CODE:-}
      SECRET_KEY: ${SECRET_KEY:-local-development-only}
      TIMEZONE: ${TIMEZONE:-Europe/Warsaw}
      CLIENT_ORIGIN: http://localhost:5173
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./server/app:/app/app
      - ./server/migrations:/app/migrations
      - ./server/scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  client:
    build:
      context: ./client
    environment:
      VITE_API_PROXY_TARGET: http://server:8000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:5173').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  client_node_modules:
  postgres_data:
